<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>استطلاع رأي الصيادلة — DawaNetwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="app-header">
    <div class="brand-bar">
      <div class="brand">
        <img src="logo.png" alt="DawaNetwork Logo" class="brand-logo" />
        <span class="wordmark">DawaNetwork</span>
      </div>
    </div>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="progress-label" id="progress-label"></div>
  </header>


  <main class="app-main">
    <form id="survey-form" novalidate>
      <div id="step-container" class="step-container"></div>
    </form>
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <button type="button" id="btn-back" class="btn btn-ghost">السابق</button>
      <button type="button" id="btn-next" class="btn btn-primary">التالي</button>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="questions.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="app.js"></script>
</body>
</html>
